name: GalaxyRelay
options:
  bundleIdPrefix: kr.infosphere
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  GalaxyRelay:
    type: application
    platform: iOS
    sources:
      - GalaxyRelay
      - RelayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.infosphere.galaxyrelay.ios
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.7.1"
        CURRENT_PROJECT_VERSION: "23"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: GalaxyRelay/Info.plist
      properties:
        CFBundleDisplayName: Galaxy Relay
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: Galaxy의 알림을 블루투스로 받고 답장과 삭제 요청을 전송합니다.
        NSCameraUsageDescription: Galaxy Relay의 연결 QR을 스캔합니다.
        NSLocationWhenInUseUsageDescription: Bluetooth 연결이 끊어진 순간에만 이 iPhone의 위치를 한 번 기록합니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 화면이 꺼져 있을 때 Bluetooth 연결이 끊어져도 그 순간의 위치를 한 번 기록하며 연결 중에는 측정하지 않습니다.
        UIBackgroundModes:
          - voip
          - bluetooth-central
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
  GalaxyRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GalaxyRelayTests]
    dependencies:
      - target: GalaxyRelay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GalaxyRelay:
    build:
      targets:
        GalaxyRelay: all

    test:
      targets:
        - GalaxyRelayTests
