plugins { id 'com.android.application' }
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
def signingFile = rootProject.file('release-signing.properties')
def localSigning = new Properties()
if (signingFile.exists()) { signingFile.withInputStream { localSigning.load(it) } }
android {
    namespace 'kr.infosphere.galaxyrelay'
    compileSdk 36
    defaultConfig { applicationId 'kr.infosphere.galaxyrelay'; minSdk 26; targetSdk 36; versionCode 21; versionName '2.5.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (signingFile.exists()) {
            personalRelease {
                storeFile rootProject.file(localSigning['storeFile'])
                storePassword localSigning['storePassword']
                keyAlias localSigning['keyAlias']
                keyPassword localSigning['keyPassword']
            }
        }
    }
    buildTypes { release {
        if (signingFile.exists()) { signingConfig signingConfigs.personalRelease }
        minifyEnabled false
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    } }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.google.firebase:firebase-messaging:25.1.3'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.work:work-runtime:2.11.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
