name: Validate remote camera
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signaling-and-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix backend
      - run: npm ci --prefix web
      - run: npm run check --prefix backend && npm test --prefix backend
      - run: node tools/test-camera-do.mjs
      - run: cd web && npx playwright install --with-deps chromium
      - run: node tools/test-camera.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: camera-peer-preview
          path: artifacts/camera-connected-preview.png
          retention-days: 3
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintRelease
